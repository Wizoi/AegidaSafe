name: CI

# Runs the whole build (compile, unit tests, guards, detekt and Android Lint with no baselines, test-time budget) on
# every push to any branch and on pull requests (Kevin, Oct 14). Needs no secrets, publishes nothing (the Play upload and the signed feed are separate, manual or
# in build-feed.yml). The project builds with JDK 17 targets; Gradle itself is run on JDK 17.
# Emulator checks are not here (scripts/emulator-checks.sh is run by hand, see docs/emulator-vs-device.md).

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Points Gradle at the Android SDK the ubuntu runner image already carries ($ANDROID_HOME).
      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, test and lint
        run: ./gradlew build --stacktrace
      - name: Keep test reports when it fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/tests/
            **/build/reports/lint-results-*.html
          retention-days: 7
