name: Build feed

# Builds the signed scam-list feed daily and publishes only feed.bin and feed.sig to the public
# Aegida-Feed repo's gh-pages branch. The builder code and the signing key stay in this private repo.
# One-time setup (keys, secrets, Pages) is in docs/feed-publishing.md.

on:
  schedule:
    - cron: '17 6 * * *'
  # Rebuild and publish when something that shapes the feed changes (not on doc or app-only pushes).
  push:
    branches: [main]
    paths:
      - 'feedtool/**'
      - 'core/src/main/kotlin/com/aegida/core/feed/**'
      - 'core/src/main/kotlin/com/aegida/core/url/**'
      - 'core/build.gradle.kts'
      - 'gradle/libs.versions.toml'
      - '.github/workflows/build-feed.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-feed
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FEED_REPO: Wizoi/Aegida-Feed
      FEED_URL: https://wizoi.github.io/Aegida-Feed
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the feed tool
        run: ./gradlew :feedtool:installDist --no-daemon

      - name: Download Phishing.Database lists
        run: |
          mkdir -p lists
          base=https://raw.githubusercontent.com/Phishing-Database/Phishing.Database/master
          curl -fsSL --retry 3 -o lists/phishing-domains.txt "$base/phishing-domains-ACTIVE.txt"
          curl -fsSL --retry 3 -o lists/phishing-links.txt "$base/phishing-links-ACTIVE.txt"
          wc -l lists/*.txt
          # Echap's spying-app indicators (CC BY 4.0, attribution in the feed's NOTICE.txt).
          curl -fsSL --retry 3 -o lists/echap-ioc.yaml https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/master/ioc.yaml
          grep -c '^- name:' lists/echap-ioc.yaml

      - name: Build and sign
        env:
          AEGIDA_FEED_SIGNING_KEY: ${{ secrets.AEGIDA_FEED_SIGNING_KEY }}
        run: |
          feedtool/build/install/feedtool/bin/feedtool build \
            --domains lists/phishing-domains.txt --links lists/phishing-links.txt --echap lists/echap-ioc.yaml --out out

      - name: Fetch the feed that is live now
        run: curl -fsS --retry 2 -o previous.bin "$FEED_URL/feed.bin" || echo "no previous feed (first run)"

      - name: Verify before publishing
        run: |
          feedtool/build/install/feedtool/bin/feedtool verify \
            --feed out/feed.bin --sig out/feed.sig \
            --public feedtool/feed-public-key.txt --previous previous.bin

      - name: Publish to ${{ env.FEED_REPO }} (gh-pages)
        env:
          DEPLOY_KEY: ${{ secrets.AEGIDA_FEED_DEPLOY_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/feed_deploy_key
          chmod 600 ~/.ssh/feed_deploy_key
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/feed_deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new'
          git clone --depth 1 "git@github.com:$FEED_REPO.git" feed-repo
          mkdir publish
          cp -r feed-repo/site/. publish/
          cp out/feed.bin out/feed.sig publish/
          cd publish
          git init -q -b gh-pages
          git config user.name "aegida-feed-bot"
          git config user.email "aegida-feed-bot@users.noreply.github.com"
          git add -A
          git commit -q -m "Feed $(date -u +%F)"
          # One commit each day, replaced in place, so 9 MB a day never builds up in the repo history.
          git push --force "git@github.com:$FEED_REPO.git" gh-pages
          rm -f ~/.ssh/feed_deploy_key
