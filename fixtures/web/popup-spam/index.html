<!doctype html>
<!-- Test fixture: imitates a website-notification spam page. Served only to the emulator via
     adb reverse (scripts/emulator-checks.sh); never published. Contains no real scam content. -->
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<title>Fixture: notification spam</title></head>
<body style="font-size:28px">
<p>Fixture page for Aegida tests.</p>
<button id="allow" style="font-size:40px;padding:24px">Allow</button>
<p id="status">waiting</p>
<script>
const status = (t) => document.getElementById('status').textContent = t;
navigator.serviceWorker.register('sw.js').then(() => status('sw registered'));
document.getElementById('allow').onclick = async () => {
  const p = await Notification.requestPermission();
  status('permission: ' + p);
  if (p === 'granted') {
    const reg = await navigator.serviceWorker.ready;
    await reg.showNotification('VIRUS DETECTED! Your phone is infected', {
      body: 'Tap now to clean your device (Aegida test fixture)', tag: 'aegida-fixture'
    });
    status('notification shown');
  }
};
</script></body></html>
